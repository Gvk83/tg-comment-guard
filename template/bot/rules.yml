# ============================================================================
#  Правила спам-фильтра. Файл можно править без изменения кода.
#  После правки отправьте боту команду /reload — правила применятся сразу.
#
#  Как это работает: бот проверяет сообщение по группам признаков ниже.
#  Каждый сработавший признак добавляет очки. Итог сравнивается с порогами.
# ============================================================================

thresholds:
  # Очки >= ban: удалить сообщение и забанить (только в режиме enforce)
  ban: 6
  # Очки >= delete: удалить сообщение, но НЕ банить
  delete: 4

scores:
  money: 3                 # найдена сумма денег
  money_large: 4           # сумма от 10 000
  money_per_period: 2      # сумма + «в день» / «за смену» / «на руки»
  job_offer: 2             # формулировка предложения работы
  contact_cta: 3           # призыв написать в личные сообщения
  telegram_link: 2         # ссылка на Telegram-аккаунт или канал
  external_link: 1         # обычная ссылка (магазин, статья) — слабый признак
  personal_deal: -5        # личное объявление или рассказ о покупке
  easy_money: 3            # обещание лёгкого/быстрого дохода
  send_material: 3         # «скину/перекину материал в личку»
  age_bait: 2              # «с 16 лет», «без опыта»
  schedule: 1              # график вида 6/1, 7:00-17:00
  obfuscation: 2           # намеренное искажение слов
  hidden_link: 3           # ссылка спрятана под текстом
  hidden_telegram_link: 4  # спрятана ссылка на Telegram-аккаунт или канал
  forwarded: 2             # переслано из другого канала
  spam_name: 3             # спам в имени или @username отправителя
  short_earn_pitch: 2      # очень короткая заманка про заработок
  duplicate: 4             # такое же сообщение уже присылали недавно
  known_spam: 10           # совпало с образцом, который вы отметили как спам
  new_member: 1            # первое сообщение пользователя в чате
  question: -2             # сообщение — вопрос (скорее всего живой человек)
  reply_to_user: -1        # ответ на комментарий другого участника

# Если НИ ОДИН из этих признаков не сработал, итог ограничивается
# значением max_score_without_context — чтобы обычная фраза с суммой
# («заказал на 12000, доставили быстро») не считалась спамом.
# Обычная ссылка сюда НЕ входит: «купил дрель за 12000, вот ссылка» —
# не объявление о работе.
context_required:
  - job_offer
  - contact_cta
  - telegram_link
  - easy_money
  - send_material
  - hidden_link
  - hidden_telegram_link
  - spam_name
  - known_spam
max_score_without_context: 3

