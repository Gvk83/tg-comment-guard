# ---------------------------------------------------------------------------
#  Белый список слов-исключений: если сообщение состоит в основном из них,
#  оно точно не спам. Сюда можно добавлять свои фразы.
# ---------------------------------------------------------------------------
safe_phrases:
  - спасибо
  - согласен
  - согласна
  - интересно было
  - хорошая статья
  - полезно
